name: ci

# The kit is source, so the whole check is install, verify and build the
# gallery. The house-style check is a separate workflow, so a failure of the
# standard stays visibly different from a failure of the code.

on:
  # Every branch, because the default branch of a repository in this
  # collection is not always main: most are on master, and one is on prod.
  # A filter on main would mean the check never ran.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: Kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:gallery
